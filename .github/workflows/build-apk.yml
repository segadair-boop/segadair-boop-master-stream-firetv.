name: Build MASTER STREAM Fire TV APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'customizar.py'
  pull_request:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'customizar.py'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout customization
        uses: actions/checkout@v4
        with:
          path: custom
      - name: Checkout Jellyfin Android TV v0.20.0
        uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-androidtv
          ref: v0.20.0
          path: jellyfin
          submodules: recursive
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME" && echo "Android SDK available at $ANDROID_HOME"
      - name: Customize app display name
        run: python3 custom/customizar.py jellyfin
      - name: Build debug APK
        working-directory: jellyfin
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MASTER-STREAM-FIRETV-APK
          path: jellyfin/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
